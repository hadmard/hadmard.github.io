			const setupReveal = () => {
				const items = document.querySelectorAll('[data-reveal]');
				if (!items.length) return;

				items.forEach((item, index) => {
					if (item instanceof HTMLElement) {
						item.style.setProperty('--reveal-index', String(Math.min(index, 6)));
					}
				});

				const observer = new IntersectionObserver(
					(entries) => {
						for (const entry of entries) {
							if (entry.isIntersecting) {
								entry.target.classList.add('is-visible');
								observer.unobserve(entry.target);
							}
						}
					},
					{ threshold: 0.12, rootMargin: '0px 0px 18% 0px' },
				);

				for (const item of items) {
					observer.observe(item);
				}
			};

			const setupMaterialMotion = () => {
				if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

				const controller = window.__materialMotionController ?? (() => {
					const states = [];
					const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
					let frame = 0;
					let scrollFrame = 0;

					const requestTick = () => {
						if (!frame) frame = window.requestAnimationFrame(tick);
					};

					const tick = () => {
						frame = 0;
						let moving = false;

						for (const state of states) {
							if (!state.root.isConnected) continue;

							state.x += (state.targetX - state.x) * 0.075;
							state.y += (state.targetY - state.y) * 0.075;
							state.scroll += (state.targetScroll - state.scroll) * 0.055;

							const dx = Math.abs(state.targetX - state.x);
							const dy = Math.abs(state.targetY - state.y);
							const ds = Math.abs(state.targetScroll - state.scroll);
							moving ||= dx > 0.0006 || dy > 0.0006 || ds > 0.0006;

							state.root.style.setProperty('--spotlight-x', `${50 + state.x * 18}%`);
							state.root.style.setProperty('--spotlight-y', `${48 + state.y * 14}%`);
							state.root.style.setProperty('--motion-amount', `${Math.min(1, Math.abs(state.x) + Math.abs(state.y))}`);

							for (const child of state.children) {
								const y = state.y * child.depth * 0.38 + state.scroll * child.scrollDepth * 0.55;
								child.element.style.setProperty('--parallax-x', `${state.x * child.depth * 0.52}px`);
								child.element.style.setProperty('--parallax-y', `${y}px`);
								child.element.style.setProperty('--parallax-rx', `${state.y * -1.1}deg`);
								child.element.style.setProperty('--parallax-ry', `${state.x * 1.35}deg`);
							}
						}

						if (moving) requestTick();
					};

					const updateScrollTargets = () => {
						scrollFrame = 0;
						const viewportCenter = window.innerHeight * 0.5;

						for (const state of states) {
							if (!state.root.isConnected || !state.children.length) continue;
							const rect = state.root.getBoundingClientRect();
							const center = rect.top + rect.height * 0.5;
							state.targetScroll = clamp((viewportCenter - center) / window.innerHeight, -1, 1);
						}

						requestTick();
					};

					const scheduleScroll = () => {
						if (!scrollFrame) scrollFrame = window.requestAnimationFrame(updateScrollTargets);
					};

					window.addEventListener('scroll', scheduleScroll, { passive: true });
					window.addEventListener('resize', scheduleScroll);

					return {
						addRoot(root) {
							if (!(root instanceof HTMLElement) || root.dataset.motionReady === 'true') return;
							root.dataset.motionReady = 'true';

							const children = [
								...root.querySelectorAll(
									'.journal-sheet, .journal-accent, .journal-halo, .hero-symbol, .hero-slab, .market-orbit, .module-glyph, .card-arrow, .button-glyph, .timeline-node, .study-date-chip, .study-card-glyph, .investment-node, .investment-glyph',
								),
							]
								.filter((child) => child instanceof HTMLElement)
								.map((element, index) => {
									const style = getComputedStyle(element);
									const depth = Number.parseFloat(style.getPropertyValue('--motion-depth')) || (index + 1) * 4.5;
									const scrollDepth = Number.parseFloat(style.getPropertyValue('--scroll-depth')) || depth * 0.28;
									return { element, depth, scrollDepth };
								});

							const state = {
								root,
								children,
								targetX: 0,
								targetY: 0,
								targetScroll: 0,
								x: 0,
								y: 0,
								scroll: 0,
							};
							states.push(state);

							root.addEventListener('pointermove', (event) => {
								const rect = root.getBoundingClientRect();
								state.targetX = clamp(((event.clientX - rect.left) / rect.width - 0.5) * 1.35, -0.8, 0.8);
								state.targetY = clamp(((event.clientY - rect.top) / rect.height - 0.5) * 1.35, -0.8, 0.8);
								requestTick();
							});

							root.addEventListener('pointerleave', () => {
								state.targetX = 0;
								state.targetY = 0;
								requestTick();
							});

							updateScrollTargets();
						},
						updateScrollTargets,
					};
				})();

				window.__materialMotionController = controller;

				document.querySelectorAll(
					'.blog-hero, .reading-hero, .article-hero, .blog-card, .thought-card, .raw-entry, .raw-empty, .study-entry',
				).forEach((root) => controller.addRoot(root));

				controller.updateScrollTargets();
			};

			document.addEventListener('astro:page-load', setupReveal);
			document.addEventListener('astro:page-load', setupMaterialMotion);
			document.addEventListener('DOMContentLoaded', setupReveal);
			document.addEventListener('DOMContentLoaded', setupMaterialMotion);
		</script> </body> </html>
